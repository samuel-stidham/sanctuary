name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      # The Go reference is built from the commit src/reference.rs names.
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: false

      # One test sources the fish output of reveal in a real fish.
      # Without fish that half of the test is skipped.
      - name: Install fish
        run: sudo apt-get update && sudo apt-get install --yes fish

      # make oracle archives the pinned commit out of a local clone.
      # Fetch that one commit, outside the working tree.
      - name: Fetch the Go reference
        run: |
          ref="$(make --silent oracle-ref)"
          test -n "$ref"
          git init --quiet "$RUNNER_TEMP/safetybox"
          git -C "$RUNNER_TEMP/safetybox" fetch --quiet --depth 1 \
            https://github.com/samuel-stidham/safetybox.git "$ref"
          echo "ORACLE_REPO=$RUNNER_TEMP/safetybox" >> "$GITHUB_ENV"

      - name: Lint
        run: make lint

      # The Go reference must pass the suite before a result from
      # sanctuary counts, so it runs first.
      - name: Conformance suite against the Go reference
        run: make test-oracle

      - name: Unit tests and the conformance suite against sanctuary
        run: make test

      - name: Parity ledger
        run: make parity

      - name: Package
        run: cargo package --locked

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # RUSTSEC-2026-0387 is the crypto-bigint advisory that arrives
      # through age. README.md lists it under known issues. Remove the
      # exception when age moves to a patched crypto-bigint.
      - name: Vulnerability scan
        run: cargo audit --ignore RUSTSEC-2026-0387

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publishes to crates.io when a v* tag is pushed and every gate above
  # passed. The tag must name the version in Cargo.toml.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, audit, gitleaks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Check the tag against Cargo.toml
        run: |
          version="$(cargo metadata --no-deps --format-version 1 --locked |
            jq --raw-output '.packages[0].version')"
          test "v$version" = "$GITHUB_REF_NAME" || {
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          }

      - name: Publish to crates.io
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
