# Dependabot version updates. One grouped pull request per ecosystem,
# opened weekly against main.
#
# The commit prefix is chore, as in the Go repository. A release is cut
# by a v* tag pushed by hand, so a merged update publishes nothing.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-deps:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
