[package]
name = "sanctuary"
version = "0.1.0"
edition = "2024"
authors = ["Samuel Stidham"]
description = "A single-user, versioned secrets vault. The Rust version of SafetyBox."
license = "MIT"
repository = "https://github.com/samuel-stidham/sanctuary"
readme = "README.md"
keywords = ["secrets", "vault", "age", "cli"]
categories = ["command-line-utilities", "cryptography"]
exclude = [".github/", "tests/", "docs/", "PORTING.md", "Makefile"]

[[bin]]
name = "sanctuary"
path = "src/main.rs"

[dependencies]
age = "0.12.1"
base64 = "0.23.1"
clap = { version = "4.6.8", features = ["derive"] }
clap_complete = "4.6.12"
nix = { version = "0.32.0", features = ["fs", "mman", "poll", "resource", "term", "signal"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
zeroize = "1.9.2"

[dev-dependencies]
age = "0.12.1"
base64 = "0.23.1"
nix = { version = "0.32.0", features = ["term", "fs", "signal", "process"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tempfile = "3.27.0"

# The identity file is sealed with scrypt, which is deliberately slow.
# Unoptimized, the test harness would spend most of its time in the KDF.
[profile.dev.package."*"]
opt-level = 3
